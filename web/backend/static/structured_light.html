<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Structured Light</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    .hud {
      position: fixed;
      left: 24px;
      bottom: 24px;
      color: rgba(255, 255, 255, 0.62);
      font: 14px/1.4 Arial, Helvetica, sans-serif;
      letter-spacing: 0.04em;
      background: rgba(0, 0, 0, 0.58);
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
  </style>
</head>
<body>
  <canvas id="pattern"></canvas>
  <div class="hud" id="hud"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const projectorId = params.get('projector_id') || 'projector';
    const patternSet = params.get('pattern_set') || params.get('pattern') || 'gray_code';
    const intervalMs = Math.max(50, Number(params.get('frame_duration_ms') || params.get('interval_ms') || 300));
    const boolParam = (name, defaultValue) => {
      const value = params.get(name);
      if (value === null) return defaultValue;
      return value.toLowerCase() === 'true';
    };
    const loop = boolParam('loop', true);
    const safeBlack = boolParam('safe_black_between_frames', true);
    const invert = boolParam('invert', false);
    const gamma = Math.max(0.1, Number(params.get('gamma') || 1));

    const canvas = document.getElementById('pattern');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    let frameIndex = 0;
    let showingBlackSpacer = false;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      draw();
    }
    window.addEventListener('resize', resize);

    function tone(value) {
      const normalized = Math.pow(value / 255, gamma);
      const corrected = Math.round(normalized * 255);
      return invert ? 255 - corrected : corrected;
    }

    const patterns = [
      { name: 'white', draw: drawWhite },
      { name: 'black', draw: drawBlack },
      { name: 'checkerboard', draw: drawCheckerboard },
      { name: 'vertical_gray_0', draw: () => drawGrayCode('x', 0) },
      { name: 'vertical_gray_1', draw: () => drawGrayCode('x', 1) },
      { name: 'vertical_gray_2', draw: () => drawGrayCode('x', 2) },
      { name: 'vertical_gray_3', draw: () => drawGrayCode('x', 3) },
      { name: 'horizontal_gray_0', draw: () => drawGrayCode('y', 0) },
      { name: 'horizontal_gray_1', draw: () => drawGrayCode('y', 1) },
      { name: 'horizontal_gray_2', draw: () => drawGrayCode('y', 2) },
      { name: 'horizontal_gray_3', draw: () => drawGrayCode('y', 3) },
      { name: 'crosshair', draw: drawCrosshair },
      { name: 'grid', draw: drawGrid }
    ];

    function activeSequence() {
      if (patternSet === 'grid') return patterns.filter(p => ['grid', 'crosshair', 'white', 'black'].includes(p.name));
      if (patternSet === 'calibration') return patterns.filter(p => ['white', 'black', 'checkerboard', 'crosshair', 'grid'].includes(p.name));
      if (patternSet === 'checkerboard') return patterns.filter(p => p.name === 'checkerboard');
      return patterns;
    }

    function fill(value) {
      const c = tone(value);
      ctx.fillStyle = `rgb(${c},${c},${c})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawWhite() {
      fill(255);
    }

    function drawBlack() {
      fill(0);
    }

    function drawCheckerboard() {
      const size = Math.max(24, Math.round(Math.min(canvas.width, canvas.height) / 16));
      for (let y = 0; y < canvas.height; y += size) {
        for (let x = 0; x < canvas.width; x += size) {
          const value = ((x / size + y / size) % 2 === 0) ? 255 : 0;
          const c = tone(value);
          ctx.fillStyle = `rgb(${c},${c},${c})`;
          ctx.fillRect(x, y, size, size);
        }
      }
    }

    function drawGrayCode(axis, bit) {
      const length = axis === 'x' ? canvas.width : canvas.height;
      const bands = Math.pow(2, bit + 2);
      const bandSize = length / bands;
      for (let i = 0; i < bands; i += 1) {
        const gray = i ^ (i >> 1);
        const on = ((gray >> bit) & 1) === 1;
        const c = tone(on ? 255 : 0);
        ctx.fillStyle = `rgb(${c},${c},${c})`;
        if (axis === 'x') {
          ctx.fillRect(i * bandSize, 0, Math.ceil(bandSize), canvas.height);
        } else {
          ctx.fillRect(0, i * bandSize, canvas.width, Math.ceil(bandSize));
        }
      }
    }

    function drawCrosshair() {
      fill(0);
      ctx.strokeStyle = `rgb(${tone(255)},${tone(255)},${tone(255)})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
      ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);
    }

    function drawGrid() {
      fill(0);
      ctx.strokeStyle = `rgb(${tone(255)},${tone(255)},${tone(255)})`;
      ctx.lineWidth = 2;
      const step = Math.max(40, Math.round(Math.min(canvas.width, canvas.height) / 12));
      for (let x = 0; x <= canvas.width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
      ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);
    }

    function draw() {
      if (showingBlackSpacer) {
        drawBlack();
        hud.textContent = `${projectorId} / spacer black`;
        return;
      }
      const sequence = activeSequence();
      const frame = sequence[frameIndex % sequence.length];
      frame.draw();
      hud.textContent = `${projectorId} / ${patternSet} / ${frame.name} / ${frameIndex + 1}/${sequence.length}`;
    }

    function nextFrame() {
      const sequence = activeSequence();
      if (safeBlack && !showingBlackSpacer) {
        showingBlackSpacer = true;
      } else {
        showingBlackSpacer = false;
        frameIndex += 1;
        if (!loop && frameIndex >= sequence.length) {
          frameIndex = sequence.length - 1;
          draw();
          return;
        }
      }
      draw();
      setTimeout(nextFrame, showingBlackSpacer ? Math.min(120, intervalMs / 2) : intervalMs);
    }

    async function heartbeat() {
      try {
        await fetch(`/api/renderer/heartbeat/${encodeURIComponent(projectorId)}`, { method: 'POST' });
      } catch (error) {
        // Pattern output must keep running if the API is unavailable.
      }
    }

    resize();
    setTimeout(nextFrame, intervalMs);
    heartbeat();
    setInterval(heartbeat, 5000);
  </script>
</body>
</html>
